name: Synchronize game archives

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'publication-request.json'

permissions: {}

concurrency:
  group: automatic-game-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test archive validation
        run: python3 -m unittest discover -s tests
      - name: Synchronize changed archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/remote_sync.py
